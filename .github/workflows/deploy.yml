name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            AI Digital Executor/package-lock.json
            AI Digital Executor/Yeti/package-lock.json

      # 1. Build AI Digital Executor
      - name: Install AI Digital Executor Dependencies
        run: npm ci
        working-directory: './AI Digital Executor'

      - name: Build AI Digital Executor
        run: npm run build
        working-directory: './AI Digital Executor'

      # 2. Build Yeti
      - name: Install Yeti Dependencies
        run: npm ci
        working-directory: './AI Digital Executor/Yeti'

      - name: Build Yeti
        run: npm run build
        working-directory: './AI Digital Executor/Yeti'

      # 3. Assemble deployment directory
      # Keep the exact relative directory layout so links resolve seamlessly on both local and GitHub Pages
      - name: Assemble Static Site
        run: |
          mkdir -p public_deploy/
          cp index.html style.css app.js public_deploy/ || true
          
          mkdir -p "public_deploy/AI Digital Executor/dist"
          cp -r "AI Digital Executor/dist/"* "public_deploy/AI Digital Executor/dist/"
          
          mkdir -p "public_deploy/AI Digital Executor/Yeti/dist"
          cp -r "AI Digital Executor/Yeti/dist/"* "public_deploy/AI Digital Executor/Yeti/dist/"

      # 4. Deploy compiled directory to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_deploy
          publish_branch: gh-pages
